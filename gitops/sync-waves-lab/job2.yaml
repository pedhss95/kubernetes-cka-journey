apiVersion: batch/v1
kind: Job
metadata:
  name: nginx-validation2
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check-nginx
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Verificando Nginx..."
              wget -q -O /dev/null \
                http://nginx-wave-service:80
              echo "Nginx respondeu com sucesso!"
